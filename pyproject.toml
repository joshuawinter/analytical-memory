[project]
name = "semantic-induction"
version = "0.1.0"
description = "Inducing a semantic layer from the SQL corpus that already encodes it"
requires-python = ">=3.11"
dependencies = [
    "sqlglot>=30.0",
    "duckdb>=1.5",
    "networkx>=3.6",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]
anthropic = [
    "anthropic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
